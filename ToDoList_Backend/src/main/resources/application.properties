spring.application.name=ToDoList_Backend

server.port=8080
server.servlet.context-path=/api

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:todolist_db}
spring.datasource.username=${DB_USERNAME:todolist_user}
spring.datasource.password=${DB_PASSWORD:todolist_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.type.preferred_string_type=VARCHAR

jwt.secret=${JWT_SECRET:c3J0LXRvZG9saXN0LWRlbW8tc2VjcmV0LWtleS1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0xMjM0NTY3ODk=}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

logging.level.srt.todolist_backend=DEBUG